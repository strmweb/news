<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    #globe-container {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(13, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.15s;
    }
    button:hover { border-color: #38bdf8; color: #38bdf8; }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    #country-search {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12px;
      width: 210px;
    }

    /* Правая панель редактора */
    #sidebar {
      width: 490px;
      max-width: 100vw;
      background: rgba(13, 17, 23, 0.98);
      border-left: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
    }
    .sidebar-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid #21262d;
    }
    .region-title {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .live-badge {
      font-size: 10px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 2px 7px;
      border-radius: 999px;
    }

    /* Блок списков сайтов СМИ */
    .media-directory {
      padding: 12px 18px;
      background: #0b0f17;
      border-bottom: 1px solid #21262d;
      max-height: 225px;
      overflow-y: auto;
    }
    .dir-group {
      margin-bottom: 10px;
    }

    .dir-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .sites-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .site-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 12px;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
    }
    .chip-native {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .chip-native:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #fff;
    }
    .chip-alt {
      background: rgba(245, 158, 11, 0.12);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .chip-alt:hover {
      background: rgba(245, 158, 11, 0.25);
      color: #fff;
    }

    /* Фильтры ленты событий */
    .feed-controls {
      padding: 10px 18px;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .tabs { display: flex; gap: 5px; }
    .tabs button { padding: 4px 9px; font-size: 11px; }
    .status-text { font-size: 11px; color: #8b949e; }

    /* Лента последних событий */
    #news-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .news-card {
      background: #161b22;
      border: 1px solid #262c36;
      border-radius: 9px;
      padding: 11px 13px;
      transition: border-color 0.15s;
    }
    .news-card:hover { border-color: #38bdf8; }

      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .source-badge {

      border-radius: 4px;
      font-weight: 600;
    }

    .badge-alt { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .news-title {
      font-size: 13.5px;
      line-height: 1.4;
      color: #f0f6fc;
      text-decoration: none;
      display: block;
      margin-bottom: 9px;
    }
    .news-title:hover { color: #38bdf8; }

    }

      font-size: 11px;
    }

      padding: 12px 18px;
      background: #0b0f17;
      border-top: 1px solid #21262d;
    }
    .composer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: #8b949e;
    }
    #tg-draft {

      height: 68px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 7px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 12px;
      resize: none;
      font-family: inherit;
      margin-bottom: 6px;
    }
    #tg-draft:focus { outline: none; border-color: #38bdf8; }
    .composer-btns {

      gap: 8px;
      justify-content: flex-end;
    }
    .btn-primary-tg {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }

    /* Всплывающее уведомление */

      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

      #globe-container { height: 42vh; }

      altList = GLOBAL_MEDIA.altSites;

  async function fetchRSS(feedObj, category) {
    try {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedObj.url)}`);
      const data = await res.json();
      if (data.status === "ok" && Array.isArray(data.items) && data.items.length > 0) {
        return data.items.slice(0, 8).map(item => ({
          title: item.title,
          link: item.link,
          source: feedObj.name,
          category: category,
          date: new Date(item.pubDate || Date.now())
        }));
      }
    } catch (e) {}

    try {
      const res2 = await fetch(`https://corsproxy.io/?${encodeURIComponent(feedObj.url)}`);
      const text = await res2.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(text, "text/xml");
      const items = Array.from(xml.querySelectorAll("item")).slice(0, 8);
      return items.map(el => ({
        title: el.querySelector("title")?.textContent?.trim() || "",
        link: el.querySelector("link")?.textContent?.trim() || "#",
        source: feedObj.name,
        category: category,
        date: new Date(el.querySelector("pubDate")?.textContent || Date.now())
      }));
    } catch (e) {
      return [];
    }
  }

    } else if (MEDIA_DB[selectedCountry]) {
      MEDIA_DB[selectedCountry].nativeRSS.forEach(f => tasks.push(fetchRSS(f, "native")));
      MEDIA_DB[selectedCountry].altRSS.forEach(f => tasks.push(fetchRSS(f, "alt")));
    } else {
      const gNative = `https://news.google.com/rss/search?q=${encodeURIComponent(selectedCountry)}&hl=en&gl=US&ceid=US:en`;
      const gAlt = `https://news.google.com/rss/search?q=${encodeURIComponent(selectedCountry + " investigation OR report")}&hl=en&gl=GB&ceid=GB:en`;
      tasks.push(fetchRSS({ name: `СМИ: ${selectedCountry}`, url: gNative }, "native"));
      tasks.push(fetchRSS({ name: `Мировые медиа`, url: gAlt }, "alt"));
    }

    const results = await Promise.all(tasks);
    const merged = results.flat();

    const seen = new Set();
    loadedArticles = merged.filter(item => {
      if (!item.title) return false;
      const key = item.title.toLowerCase().slice(0, 45);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).sort((a, b) => b.date - a.date);

    renderNews();
  }

  function formatForTelegram(item) {
    const hashtag = selectedCountry
      ? (MEDIA_DB[selectedCountry]?.tag || `#${selectedCountry.replace(/\s+/g, "_")}`)
      : GLOBAL_MEDIA.tag;
    return `⚡️ ${item.title}\n\nИсточник: ${item.source}\n🔗 ${item.link}\n\n${hashtag}`;
  }

  function renderNews() {
    const listEl = document.getElementById("news-list");
    const statusEl = document.getElementById("feed-status");

    const filtered = loadedArticles.filter(item => activeFilter === "all" || item.category === activeFilter);
    statusEl.textContent = `Событий: ${filtered.length}`;
    listEl.innerHTML = "";

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="color:#8b949e;padding:16px;text-align:center;font-size:12px;">Сводки подгружаются. Вы можете сразу открыть любой из сайтов СМИ выше ☝️</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "news-card";

      const isNative = item.category === "native";
      const badgeClass = isNative ? "badge-native" : "badge-alt";
      const badgeLabel = isNative ? `Родное СМИ • ${item.source}` : `Альтернатива • ${item.source}`;
      const timeStr = isNaN(item.date.getTime())
        ? "Сегодня"
        : item.date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

      card.innerHTML = `
        <div class="news-meta">
          <span class="source-badge ${badgeClass}">${badgeLabel}</span>
          <span style="color:#8b949e;">${timeStr}</span>
        </div>
        <a class="news-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
        <div class="card-actions">
          <button class="btn-to-draft">+ В черновик</button>
          <button class="btn-copy-tg">📋 Копировать для TG</button>
        </div>
      `;

      card.querySelector(".btn-copy-tg").addEventListener("click", () => {
        navigator.clipboard.writeText(formatForTelegram(item));
        showToast("✅ Пост скопирован! Вставляй в Telegram (Ctrl+V)");
      });

      card.querySelector(".btn-to-draft").addEventListener("click", () => {
        const draft = document.getElementById("tg-draft");
        draft.value += (draft.value ? "\n\n" : "") + `• ${item.title} (${item.source})`;
        showToast("Добавлено в черновик");
      });

      listEl.appendChild(card);
    });
  }

  // Инициализация 3D-глобуса
  const world = Globe()(document.getElementById("globe-container"))
    .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
    .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
    .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
    .lineHoverPrecision(0)
    .polygonAltitude(d => (d.properties.ADMIN === selectedCountry ? 0.05 : 0.01))
    .polygonCapColor(d =>
      d.properties.ADMIN === selectedCountry
        ? "rgba(56, 189, 248, 0.55)"
        : "rgba(30, 41, 59, 0.25)"
    )
    .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
    .polygonStrokeColor(d =>
      d.properties.ADMIN === selectedCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.35)"
    )
    .polygonLabel(({ properties: d }) => {
      const custom = MEDIA_DB[d.ADMIN];
      return `
        <div style="background:rgba(13,17,23,0.92);padding:6px 10px;border-radius:6px;border:1px solid #38bdf8;font-size:12px;">
          <b>${custom ? custom.ruName : d.ADMIN}</b><br/>
          <span style="color:#94a3b8;font-size:11px;">Нажмите: открыть сайты СМИ и сводки</span>
        </div>
      `;
    })
    .onPolygonClick(polygon => {
      selectCountry(polygon.properties.ADMIN, polygon);
    })
    .onGlobeClick(() => {
      const now = Date.now();
      if (now - lastClickTime < 350) resetToGlobal();
      lastClickTime = now;
    });

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  // Загрузка границ стран + Крым в составе Украины
  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
    .then(res => res.json())
    .then(countries => {
      const ukraine = countries.features.find(f => f.properties.ADMIN === "Ukraine");
      const crimea = countries.features.find(f =>
        (f.properties.NAME && f.properties.NAME.includes("Crimea")) ||
        (f.properties.ADMIN && f.properties.ADMIN.includes("Crimea"))
      );
      if (ukraine && crimea) {
        crimea.properties.ADMIN = "Ukraine";
        crimea.properties.NAME = "Ukraine";
      }

      fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
        .then(r => r.json())
        .then(ukrGeo => {
          if (ukrGeo && ukrGeo.features && ukrGeo.features[0] && ukraine) {
            ukraine.geometry = ukrGeo.features[0].geometry;
          }
          applyCountries(countries.features);
        })
        .catch(() => applyCountries(countries.features));
    });

  function applyCountries(features) {
    countriesFeatures = features.filter(d => d.properties.ISO_A2 !== "AQ");
    world.polygonsData(countriesFeatures);

    const datalist = document.getElementById("countries-datalist");
    countriesFeatures.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.properties.ADMIN;
      datalist.appendChild(opt);
    });
  }

  function selectCountry(countryName, featureObj = null) {
    selectedCountry = countryName;
    world.controls().autoRotate = false;
    world.polygonsData(world.polygonsData());

    const custom = MEDIA_DB[countryName];
    document.getElementById("current-region").textContent = custom ? custom.ruName : `📍 ${countryName}`;
    document.getElementById("btn-world").classList.remove("active");

    if (featureObj && featureObj.bbox) {
      const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
      world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 1000);
    } else if (countryName === "Ukraine") {
      world.pointOfView({ lat: 48.5, lng: 31.5, altitude: 1.2 }, 1000);
    }

    countdown = 30;
    renderMediaDirectory();
    loadNews();
  }

  function resetToGlobal() {
    selectedCountry = null;
    world.controls().autoRotate = true;
    world.polygonsData(world.polygonsData());
    document.getElementById("current-region").textContent = "🌍 Мировой радар СМИ";
    document.getElementById("btn-world").classList.add("active");
    world.pointOfView({ altitude: 2.3 }, 1000);
    countdown = 30;
    renderMediaDirectory();
    loadNews();
  }

  document.getElementById("btn-world").addEventListener("click", resetToGlobal);

  document.getElementById("country-search").addEventListener("change", e => {
    const val = e.target.value.trim();
    const found = countriesFeatures.find(f => f.properties.ADMIN.toLowerCase() === val.toLowerCase());
    if (found) selectCountry(found.properties.ADMIN, found);
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderNews();
    });
  });

  document.getElementById("btn-copy-draft").addEventListener("click", () => {
    const text = document.getElementById("tg-draft").value.trim();
    if (!text) return;
    navigator.clipboard.writeText(text);
    showToast("✅ Черновик скопирован для Telegram!");
  });

  document.getElementById("btn-clear-draft").addEventListener("click", () => {
    document.getElementById("tg-draft").value = "";
  });

  setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      countdown = 30;
      loadNews();
    }
    document.getElementById("update-timer").textContent = `Автообновление: ${countdown}с`;
  }, 1000);

  renderMediaDirectory();
  loadNews();
</script>
</body>
</html>
