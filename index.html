<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TG News Radar</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Верхняя часть: 3D-глобус */
    #globe-container {
      width: 100%;
      height: 34dvh;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid #21262d;
    }
    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button {
      background: rgba(22, 27, 34, 0.92);
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    #country-search {
      flex: 1;
      min-width: 0;
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid #30363d;
      color: #fff;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 13px;
    }
    #country-search:focus { outline: none; border-color: #38bdf8; }

    /* Нижняя часть: Рабочий пульт для Android */
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      min-height: 0;
    }

    .panel-header {
      padding: 11px 14px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .region-title {
      font-size: 17px;
      font-weight: 700;
      color: #f0f6fc;
    }
    .hint-text {
      font-size: 11px;
      color: #8b949e;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-card {
      background: #131822;
      border: 1px solid #262c36;
      border-radius: 12px;
      padding: 11px 12px;
    }
    .group-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    /* Список ссылок строго в столбик: Название слева — Ссылка справа */
    .links-column {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      background: #161b22;
      border: 1px solid #2b323d;
      border-radius: 9px;
      text-decoration: none;
      color: #f0f6fc;
      font-size: 13.5px;
    }
    .link-row:active {
      background: #1f2937;
      border-color: #38bdf8;
    }
    .link-name {
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .link-url {
      color: #38bdf8;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .link-row.alt-row .link-url {
      color: #fbbf24;
    }

    /* Нижний черновик для Telegram */
    .tg-composer {
      padding: 10px 14px 12px;
      background: #161b22;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
    }
    #tg-draft {
      width: 100%;
      height: 62px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 9px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 13px;
      resize: none;
      font-family: inherit;
      margin-bottom: 7px;
    }
    #tg-draft:focus { outline: none; border-color: #38bdf8; }
    .composer-actions {
      display: flex;
      gap: 6px;
    }
    .composer-actions button {
      flex: 1;
      padding: 9px 8px;
      font-size: 12.5px;
    }
    .btn-copy-tg {
      background: #16a34a;
      border-color: #22c55e;
      color: #fff;
      font-weight: 600;
      flex: 1.5 !important;
    }

    #toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

    /* Для больших экранов ПК */
    @media (min-width: 900px) {
      body { flex-direction: row; }
      #globe-container { flex: 1; height: 100dvh; border-bottom: none; border-right: 1px solid #21262d; }
      #panel { width: 500px; height: 100dvh; }
    }
  </style>
</head>
<body>

<div id="globe-container">
  <div id="top-bar">
    <button id="btn-world" class="active">Весь мир</button>
    <input type="text" id="country-search" placeholder="Поиск страны (Ukraine, France)..." list="countries-datalist" />
    <datalist id="countries-datalist"></datalist>
  </div>
</div>

<div id="panel">
  <div class="panel-header">
    <span class="region-title" id="current-region">Мировые СМИ</span>
    <span class="hint-text">Нажми на сайт для перехода</span>
  </div>

  <div class="scroll-area">
    <!-- Официальные / Родные СМИ -->
    <div class="group-card">
      <div class="group-label">Официальные / Родные СМИ</div>
      <div class="links-column" id="official-list"></div>
    </div>

    <!-- Альтернативные СМИ -->
    <div class="group-card">
      <div class="group-label">Альтернативные / Международные</div>
      <div class="links-column" id="alt-list"></div>
    </div>

    <!-- Лента новостей по стране -->
    <div class="group-card">
      <div class="group-label">Свежие сводки по региону</div>
      <div class="links-column" id="feed-list"></div>
    </div>
  </div>

  <div class="tg-composer">
    <textarea id="tg-draft" placeholder="Черновик поста для Telegram..."></textarea>
    <div class="composer-actions">
      <button id="btn-clear">Очистить</button>
      <button id="btn-paste">Вставить</button>
      <button id="btn-copy" class="btn-copy-tg">Копировать в TG</button>
    </div>
  </div>
</div>

<div id="toast">Скопировано!</div>

<script>
  /* ============================================================================
     БАЗА СТРАН И ССЫЛОК (Без флагов и хэштегов — добавляй свои сайты по шаблону)
     ============================================================================ */
  const MY_COUNTRIES_DB = {
    "Ukraine": {
      ruName: "Украина",
      official: [
        { name: "Укрінформ", url: "https://www.ukrinform.ua/" },
        { name: "Суспільне Новини", url: "https://suspilne.media/" },
        { name: "РБК-Україна", url: "https://www.rbc.ua/" }
      ],
      alternative: [
        { name: "Українська правда", url: "https://www.pravda.com.ua/" },
        { name: "BBC Україна", url: "https://www.bbc.com/ukrainian" },
        { name: "Радіо Свобода", url: "https://www.radiosvoboda.org/" }
      ]
    },

    "France": {
      ruName: "Франция",
      official: [
        { name: "AFP", url: "https://www.afp.com/fr" },
        { name: "France Info", url: "https://www.francetvinfo.fr/" },
        { name: "Le Monde", url: "https://www.lemonde.fr/" }
      ],
      alternative: [
        { name: "Mediapart", url: "https://www.mediapart.fr/" },
        { name: "France 24", url: "https://www.france24.com/fr/" }
      ]
    },

    "Germany": {
      ruName: "Германия",
      official: [
        { name: "Tagesschau", url: "https://www.tagesschau.de/" },
        { name: "Der Spiegel", url: "https://www.spiegel.de/" }
      ],
      alternative: [
        { name: "Deutsche Welle", url: "https://www.dw.com/" }
      ]
    },

    "United States of America": {
      ruName: "США",
      official: [
        { name: "Associated Press", url: "https://apnews.com/" },
        { name: "NPR News", url: "https://www.npr.org/" }
      ],
      alternative: [
        { name: "The Intercept", url: "https://theintercept.com/" },
        { name: "The Guardian US", url: "https://www.theguardian.com/us" }
      ]
    },

    "United Kingdom": {
      ruName: "Великобритания",
      official: [
        { name: "BBC News UK", url: "https://www.bbc.co.uk/news" },
        { name: "Sky News", url: "https://news.sky.com/" }
      ],
      alternative: [
        { name: "The Guardian", url: "https://www.theguardian.com/uk" }
      ]
    },

    "Poland": {
      ruName: "Польша",
      official: [
        { name: "PAP", url: "https://www.pap.pl/" },
        { name: "TVN24", url: "https://tvn24.pl/" }
      ],
      alternative: [
        { name: "OKO.press", url: "https://oko.press/" }
      ]
    },

    "Russia": {
      ruName: "Россия",
      official: [
        { name: "ТАСС", url: "https://tass.ru/" },
        { name: "РИА Новости", url: "https://ria.ru/" },
        { name: "Интерфакс", url: "https://www.interfax.ru/" }
      ],
      alternative: [
        { name: "Медуза", url: "https://meduza.io/" },
        { name: "BBC Русская служба", url: "https://www.bbc.com/russian" },
        { name: "Медиазона", url: "https://zona.media/" }
      ]
    }
  };

  const GLOBAL_DB = {
    ruName: "Мировые СМИ",
    official: [
      { name: "Reuters", url: "https://www.reuters.com/" },
      { name: "Associated Press", url: "https://apnews.com/" },
      { name: "BBC World", url: "https://www.bbc.com/news/world" }
    ],
    alternative: [
      { name: "Al Jazeera", url: "https://www.aljazeera.com/" },
      { name: "DW на русском", url: "https://www.dw.com/ru/" }
    ]
  };

  let selectedCountry = null;
  let countriesFeatures = [];
  let lastClickTime = 0;

  function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  function renderRow(site, extraClass = "") {
    return `
      <a class="link-row ${extraClass}" href="${site.url}" target="_blank" rel="noopener noreferrer">
        <span class="link-name">${site.name}</span>
        <span class="link-url">${site.url}</span>
      </a>
    `;
  }

  function renderCountryPanel() {
    const titleEl = document.getElementById("current-region");
    const officialBox = document.getElementById("official-list");
    const altBox = document.getElementById("alt-list");
    const feedBox = document.getElementById("feed-list");

    const matchedKey = selectedCountry
      ? Object.keys(MY_COUNTRIES_DB).find(k => k.toLowerCase() === selectedCountry.toLowerCase())
      : null;

    let data = null;
    if (!selectedCountry) {
      data = GLOBAL_DB;
    } else if (matchedKey) {
      data = MY_COUNTRIES_DB[matchedKey];
    } else {
      const q = encodeURIComponent(selectedCountry);
      data = {
        ruName: selectedCountry,
        official: [
          { name: `Reuters (${selectedCountry})`, url: `https://www.reuters.com/site-search/?query=${q}` },
          { name: `AP News (${selectedCountry})`, url: `https://apnews.com/search?q=${q}` }
        ],
        alternative: [
          { name: `BBC (${selectedCountry})`, url: `https://www.bbc.co.uk/search?q=${q}` },
          { name: `Al Jazeera (${selectedCountry})`, url: `https://www.aljazeera.com/search/${q}` }
        ]
      };
    }

    titleEl.textContent = data.ruName;
    officialBox.innerHTML = data.official.map(s => renderRow(s)).join("");
    altBox.innerHTML = data.alternative.map(s => renderRow(s, "alt-row")).join("");

    const searchQuery = selectedCountry || "world news";
    const gNewsUrl = `https://news.google.com/search?q=${encodeURIComponent(searchQuery)}`;
    feedBox.innerHTML = renderRow({ name: `Лента новостей (${searchQuery})`, url: gNewsUrl });
  }

  // Проверка, попадает ли контур (кольцо координат) в границы Крымского полуострова
  function isCrimeaPolygon(ring) {
    if (!Array.isArray(ring) || ring.length === 0) return false;
    let sumLng = 0, sumLat = 0;
    ring.forEach(pt => {
      sumLng += pt[0];
      sumLat += pt[1];
    });
    const avgLng = sumLng / ring.length;
    const avgLat = sumLat / ring.length;
    return avgLng >= 32.4 && avgLng <= 36.7 && avgLat >= 44.3 && avgLat <= 46.25;
  }

  // Инициализация глобуса
  const container = document.getElementById("globe-container");
  const world = Globe()(container)
    .width(container.clientWidth)
    .height(container.clientHeight)
    .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
    .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
    .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
    .lineHoverPrecision(0)
    .polygonAltitude(d => (d.properties.ADMIN === selectedCountry ? 0.05 : 0.01))
    .polygonCapColor(d => d.properties.ADMIN === selectedCountry ? "rgba(56, 189, 248, 0.55)" : "rgba(30, 41, 59, 0.25)")
    .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
    .polygonStrokeColor(d => d.properties.ADMIN === selectedCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.35)")
    .polygonLabel(({ properties: d }) => {
      const matchedKey = Object.keys(MY_COUNTRIES_DB).find(k => k.toLowerCase() === d.ADMIN.toLowerCase());
      const custom = matchedKey ? MY_COUNTRIES_DB[matchedKey] : null;
      return `<div style="background:rgba(13,17,23,0.95);padding:6px 10px;border-radius:6px;border:1px solid #38bdf8;font-size:12px;"><b>${custom ? custom.ruName : d.ADMIN}</b></div>`;
    })
    .onPolygonClick(polygon => {
      selectCountry(polygon.properties.ADMIN, polygon);
    })
    .onGlobeClick(() => {
      const now = Date.now();
      if (now - lastClickTime < 350) resetToGlobal();
      lastClickTime = now;
    });

  window.addEventListener("resize", () => {
    world.width(container.clientWidth).height(container.clientHeight);
  });

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  // Загрузка границ стран (исключаем Крым из РФ и закрепляем его за Украиной)
  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
    .then(res => res.json())
    .then(countries => {
      const ukraine = countries.features.find(f => f.properties.ADMIN === "Ukraine");
      const russia = countries.features.find(f => f.properties.ADMIN === "Russia");

      // Удаляем отдельные полигоны Крыма из набора данных, если они идут отдельным объектом
      countries.features = countries.features.filter(f => {
        const name = (f.properties.NAME || "") + " " + (f.properties.ADMIN || "");
        return !name.toLowerCase().includes("crimea");
      });

      // Вырезаем Крым из MultiPolygon России, если он там присутствует
      if (russia && russia.geometry && russia.geometry.type === "MultiPolygon") {
        russia.geometry.coordinates = russia.geometry.coordinates.filter(poly => !isCrimeaPolygon(poly[0]));
      }

      // Подгружаем точный международно признанный контур Украины с Крымом
      fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
        .then(r => r.json())
        .then(ukrGeo => {
          if (ukrGeo && ukrGeo.features && ukrGeo.features[0] && ukraine) {
            ukraine.geometry = ukrGeo.features[0].geometry;
          }
          applyCountries(countries.features);
        })
        .catch(() => applyCountries(countries.features));
    });

  function applyCountries(features) {
    countriesFeatures = features.filter(d => d.properties.ISO_A2 !== "AQ");
    world.polygonsData(countriesFeatures);
    const datalist = document.getElementById("countries-datalist");
    countriesFeatures.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.properties.ADMIN;
      datalist.appendChild(opt);
    });
  }

  function selectCountry(countryName, featureObj = null) {
    selectedCountry = countryName;
    world.controls().autoRotate = false;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.remove("active");

    if (featureObj && featureObj.bbox) {
      const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
      world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 900);
    }
    renderCountryPanel();
  }

  function resetToGlobal() {
    selectedCountry = null;
    world.controls().autoRotate = true;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.add("active");
    world.pointOfView({ altitude: 2.3 }, 900);
    renderCountryPanel();
  }

  document.getElementById("btn-world").addEventListener("click", resetToGlobal);

  document.getElementById("country-search").addEventListener("change", e => {
    const val = e.target.value.trim().toLowerCase();
    const found = countriesFeatures.find(f => f.properties.ADMIN.toLowerCase() === val);
    if (found) selectCountry(found.properties.ADMIN, found);
  });

  document.getElementById("btn-copy").addEventListener("click", () => {
    const draft = document.getElementById("tg-draft").value.trim();
    if (!draft) return;
    navigator.clipboard.writeText(draft);
    showToast("Скопировано для Telegram");
  });

  document.getElementById("btn-paste").addEventListener("click", async () => {
    try {
      const text = await navigator.clipboard.readText();
      const draft = document.getElementById("tg-draft");
      draft.value += (draft.value ? "\n\n" : "") + text;
    } catch {
      showToast("Вставь текст вручную в поле");
    }
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    document.getElementById("tg-draft").value = "";
  });

  renderCountryPanel();
</script>
</body>
</html>
