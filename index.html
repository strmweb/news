<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Новостные порталы мира</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Верхняя часть: 3D-планета */
    #globe-container {
      width: 100%;
      height: 40dvh;
      position: relative;
      flex-shrink: 0;
      border-bottom: 1px solid #21262d;
    }
    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      gap: 6px;
      pointer-events: none;
    }
    #top-bar button, #top-bar input {
      pointer-events: auto;
    }
    button {
      background: rgba(22, 27, 34, 0.94);
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    #country-search {
      flex: 1;
      min-width: 0;
      background: rgba(13, 17, 23, 0.94);
      border: 1px solid #30363d;
      color: #fff;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 13px;
    }

    /* Нижняя часть: Ссылки столбиком */
    #panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      min-height: 0;
    }
    .panel-header {
      padding: 12px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .region-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .region-sub {
      font-size: 12px;
      color: #8b949e;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .links-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      background: #161b22;
      border: 1px solid #2b323d;
      border-radius: 10px;
      text-decoration: none;
      color: #f0f6fc;
      font-size: 14px;
    }
    .link-row:active {
      background: #1e293b;
      border-color: #38bdf8;
    }
    .link-name {
      font-weight: 600;
      flex-shrink: 0;
    }
    .link-url {
      color: #38bdf8;
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .link-row.alt .link-url {
      color: #fbbf24;
    }

    @media (min-width: 900px) {
      body { flex-direction: row; }
      #globe-container { flex: 1; height: 100dvh; border-bottom: none; border-right: 1px solid #21262d; }
      #panel { width: 480px; height: 100dvh; }
    }
  </style>
</head>
<body>

<div id="globe-container">
  <div id="top-bar">
    <button id="btn-world" class="active">Весь мир</button>
    <input type="text" id="country-search" placeholder="Найти страну (Ukraine, Russia, France...)" list="countries-datalist" />
    <datalist id="countries-datalist"></datalist>
  </div>
</div>

<div id="panel">
  <div class="panel-header">
    <span class="region-title" id="region-title">Мировые порталы</span>
    <span class="region-sub" id="region-status">Нажми на страну</span>
  </div>

  <div class="scroll-area">
    <div>
      <div class="group-title">Официальные / Родные СМИ</div>
      <div class="links-column" id="official-links"></div>
    </div>

    <div>
      <div class="group-title">Альтернативные / Международные</div>
      <div class="links-column" id="alt-links"></div>
    </div>
  </div>
</div>

<script>
  /* ============================================================================
     БАЗА СТРАН И ССЫЛОК (Добавляй свои страны и сайты сюда)
     ============================================================================ */
  const COUNTRIES_DB = {
    "Ukraine": {
      name: "Украина",
      official: [
        { title: "Укрінформ", url: "https://www.ukrinform.ua/" },
        { title: "Суспільне Новини", url: "https://suspilne.media/" },
        { title: "РБК-Україна", url: "https://www.rbc.ua/" }
      ],
      alternative: [
        { title: "Українська правда", url: "https://www.pravda.com.ua/" },
        { title: "BBC Україна", url: "https://www.bbc.com/ukrainian" },
        { title: "Радіо Свобода", url: "https://www.radiosvoboda.org/" }
      ]
    },
    "Russia": {
      name: "Россия",
      official: [
        { title: "ТАСС", url: "https://tass.ru/" },
        { title: "РИА Новости", url: "https://ria.ru/" },
        { title: "Интерфакс", url: "https://www.interfax.ru/" }
      ],
      alternative: [
        { title: "Медуза", url: "https://meduza.io/" },
        { title: "BBC Русская служба", url: "https://www.bbc.com/russian" },
        { title: "Медиазона", url: "https://zona.media/" }
      ]
    },
    "France": {
      name: "Франция",
      official: [
        { title: "AFP", url: "https://www.afp.com/fr" },
        { title: "France Info", url: "https://www.francetvinfo.fr/" },
        { title: "Le Monde", url: "https://www.lemonde.fr/" }
      ],
      alternative: [
        { title: "Mediapart", url: "https://www.mediapart.fr/" },
        { title: "France 24", url: "https://www.france24.com/fr/" }
      ]
    },
    "Germany": {
      name: "Германия",
      official: [
        { title: "Tagesschau", url: "https://www.tagesschau.de/" },
        { title: "Der Spiegel", url: "https://www.spiegel.de/" }
      ],
      alternative: [
        { title: "Deutsche Welle", url: "https://www.dw.com/" }
      ]
    },
    "United States of America": {
      name: "США",
      official: [
        { title: "Associated Press", url: "https://apnews.com/" },
        { title: "NPR News", url: "https://www.npr.org/" }
      ],
      alternative: [
        { title: "The Intercept", url: "https://theintercept.com/" },
        { title: "The Guardian US", url: "https://www.theguardian.com/us" }
      ]
    },
    "United Kingdom": {
      name: "Великобритания",
      official: [
        { title: "BBC News UK", url: "https://www.bbc.co.uk/news" },
        { title: "Sky News", url: "https://news.sky.com/" }
      ],
      alternative: [
        { title: "The Guardian", url: "https://www.theguardian.com/uk" }
      ]
    },
    "Poland": {
      name: "Польша",
      official: [
        { title: "PAP", url: "https://www.pap.pl/" },
        { title: "TVN24", url: "https://tvn24.pl/" }
      ],
      alternative: [
        { title: "OKO.press", url: "https://oko.press/" }
      ]
    }
  };

  const WORLD_DEFAULT = {
    name: "Мировые порталы",
    official: [
      { title: "Reuters", url: "https://www.reuters.com/" },
      { title: "Associated Press", url: "https://apnews.com/" },
      { title: "BBC World", url: "https://www.bbc.com/news/world" }
    ],
    alternative: [
      { title: "Al Jazeera", url: "https://www.aljazeera.com/" },
      { title: "DW на русском", url: "https://www.dw.com/ru/" }
    ]
  };

  let activeCountry = null;
  let allPolygons = [];

  function makeLinkRow(item, isAlt) {
    const a = document.createElement("a");
    a.className = isAlt ? "link-row alt" : "link-row";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const spanName = document.createElement("span");
    spanName.className = "link-name";
    spanName.textContent = item.title;

    const spanUrl = document.createElement("span");
    spanUrl.className = "link-url";
    spanUrl.textContent = item.url;

    a.appendChild(spanName);
    a.appendChild(spanUrl);
    return a;
  }

  function renderLinks(countryKey) {
    const titleEl = document.getElementById("region-title");
    const statusEl = document.getElementById("region-status");
    const officialBox = document.getElementById("official-links");
    const altBox = document.getElementById("alt-links");

    officialBox.innerHTML = "";
    altBox.innerHTML = "";

    let info = WORLD_DEFAULT;

    if (countryKey) {
      const foundKey = Object.keys(COUNTRIES_DB).find(
        k => k.toLowerCase() === countryKey.toLowerCase()
      );
      if (foundKey) {
        info = COUNTRIES_DB[foundKey];
      } else {
        const q = encodeURIComponent(countryKey);
        info = {
          name: countryKey,
          official: [
            { title: "Reuters", url: `https://www.reuters.com/site-search/?query=${q}` },
            { title: "Associated Press", url: `https://apnews.com/search?q=${q}` }
          ],
          alternative: [
            { title: "BBC News", url: `https://www.bbc.co.uk/search?q=${q}` },
            { title: "Al Jazeera", url: `https://www.aljazeera.com/search/${q}` }
          ]
        };
      }
      statusEl.textContent = "Ссылки открыты";
    } else {
      statusEl.textContent = "Весь мир";
    }

    titleEl.textContent = info.name;

    info.official.forEach(item => officialBox.appendChild(makeLinkRow(item, false)));
    info.alternative.forEach(item => altBox.appendChild(makeLinkRow(item, true)));
  }

  // Проверка координат Крыма, чтобы исключить его из полигона России
  function isCrimeaRing(ring) {
    if (!Array.isArray(ring) || ring.length === 0) return false;
    let lngSum = 0, latSum = 0;
    for (let i = 0; i < ring.length; i++) {
      lngSum += ring[i][0];
      latSum += ring[i][1];
    }
    const lng = lngSum / ring.length;
    const lat = latSum / ring.length;
    return lng >= 32.4 && lng <= 36.7 && lat >= 44.3 && lat <= 46.25;
  }

  // Инициализация 3D-глобуса
  const container = document.getElementById("globe-container");
  const world = Globe()(container)
    .width(container.clientWidth)
    .height(container.clientHeight)
    .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
    .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
    .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
    .polygonAltitude(d => (d.properties.ADMIN === activeCountry ? 0.05 : 0.012))
    .polygonCapColor(d =>
      d.properties.ADMIN === activeCountry ? "rgba(56, 189, 248, 0.6)" : "rgba(30, 41, 59, 0.28)"
    )
    .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
    .polygonStrokeColor(d =>
      d.properties.ADMIN === activeCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.4)"
    )
    .onPolygonClick(polygon => {
      if (!polygon || !polygon.properties) return;
      selectCountry(polygon.properties.ADMIN, polygon);
    });

  window.addEventListener("resize", () => {
    world.width(container.clientWidth).height(container.clientHeight);
  });

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  // Загрузка границ стран (Крым закреплён за Украиной и удалён у России)
  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
    .then(r => r.json())
    .then(data => {
      const ukraine = data.features.find(f => f.properties.ADMIN === "Ukraine");
      const russia = data.features.find(f => f.properties.ADMIN === "Russia");

      data.features = data.features.filter(f => {
        const label = ((f.properties.NAME || "") + " " + (f.properties.ADMIN || "")).toLowerCase();
        return !label.includes("crimea") && f.properties.ISO_A2 !== "AQ";
      });

      if (russia && russia.geometry && russia.geometry.type === "MultiPolygon") {
        russia.geometry.coordinates = russia.geometry.coordinates.filter(poly => !isCrimeaRing(poly[0]));
      }

      fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
        .then(r => r.json())
        .then(ukr => {
          if (ukr && ukr.features && ukr.features[0] && ukraine) {
            ukraine.geometry = ukr.features[0].geometry;
          }
          setupMap(data.features);
        })
        .catch(() => setupMap(data.features));
    });

  function setupMap(features) {
    allPolygons = features;
    world.polygonsData(allPolygons);

    const datalist = document.getElementById("countries-datalist");
    allPolygons.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.properties.ADMIN;
      datalist.appendChild(opt);
    });
  }

  function selectCountry(countryName, featureObj) {
    activeCountry = countryName;
    world.controls().autoRotate = false;
    world.polygonsData(allPolygons);
    document.getElementById("btn-world").classList.remove("active");

    if (featureObj && featureObj.bbox) {
      const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
      world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 800);
    }

    renderLinks(countryName);
  }

  document.getElementById("btn-world").addEventListener("click", () => {
    activeCountry = null;
    world.controls().autoRotate = true;
    world.polygonsData(allPolygons);
    document.getElementById("btn-world").classList.add("active");
    world.pointOfView({ altitude: 2.3 }, 800);
    renderLinks(null);
  });

  document.getElementById("country-search").addEventListener("change", e => {
    const val = e.target.value.trim().toLowerCase();
    const found = allPolygons.find(f => f.properties.ADMIN.toLowerCase() === val);
    if (found) selectCountry(found.properties.ADMIN, found);
  });

  // Сразу показываем мировые ссылки при старте
  renderLinks(null);
</script>
</body>
</html>
