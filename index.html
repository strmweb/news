<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новостные порталы мира</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 3D-глобус */
    #globe-wrapper {
      width: 100%;
      height: 300px;
      position: relative;
      background: #050811;
      border-bottom: 1px solid #21262d;
      overflow: hidden;
    }
    #globe-container {
      width: 100%;
      height: 100%;
    }
    #top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    #country-select {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* Панель со ссылками */
    #panel {
      flex: 1;
      background: #0d1117;
      padding: 14px 16px 40px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #21262d;
    }
    .region-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
    }
    .region-sub {
      font-size: 12px;
      color: #8b949e;
    }

    .section-block {
      margin-bottom: 18px;
    }
    .group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .links-column {
      display: block;
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      margin-bottom: 8px;
      background: #161b22;
      border: 1px solid #2b323d;
      border-radius: 9px;
      text-decoration: none;
      color: #f0f6fc;
      font-size: 14px;
    }
    .link-row:active, .link-row:hover {
      background: #1e293b;
      border-color: #38bdf8;
    }
    .link-name {
      font-weight: 600;
      flex-shrink: 0;
    }
    .link-url {
      color: #38bdf8;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }
    .link-row.alt .link-url {
      color: #fbbf24;
    }

    @media (min-width: 900px) {
      body { flex-direction: row; height: 100vh; overflow: hidden; }
      #globe-wrapper { flex: 1; height: 100vh; border-bottom: none; border-right: 1px solid #21262d; }
      #panel { width: 480px; height: 100vh; overflow-y: auto; }
    }
  </style>
</head>
<body>

<div id="globe-wrapper">
  <div id="top-bar">
    <button id="btn-world" class="active" onclick="selectWorld()">Весь мир</button>
    <select id="country-select" onchange="onSelectDropdown(this.value)">
      <option value="">-- Выбрать страну из списка --</option>
    </select>
  </div>
  <div id="globe-container"></div>
</div>

<div id="panel">
  <div class="panel-header">
    <span class="region-title" id="region-title">Мировые порталы</span>
    <span class="region-sub" id="region-status">Нажми на страну</span>
  </div>

  <div class="section-block">
    <div class="group-title">Официальные / Родные СМИ</div>
    <div class="links-column" id="official-links">
      <a class="link-row" href="https://www.reuters.com/" target="_blank" rel="noopener">
        <span class="link-name">Reuters</span>
        <span class="link-url">https://www.reuters.com/</span>
      </a>
      <a class="link-row" href="https://apnews.com/" target="_blank" rel="noopener">
        <span class="link-name">Associated Press</span>
        <span class="link-url">https://apnews.com/</span>
      </a>
      <a class="link-row" href="https://www.bbc.com/news/world" target="_blank" rel="noopener">
        <span class="link-name">BBC World</span>
        <span class="link-url">https://www.bbc.com/news/world</span>
      </a>
    </div>
  </div>

  <div class="section-block">
    <div class="group-title">Альтернативные / Международные</div>
    <div class="links-column" id="alt-links">
      <a class="link-row alt" href="https://www.aljazeera.com/" target="_blank" rel="noopener">
        <span class="link-name">Al Jazeera</span>
        <span class="link-url">https://www.aljazeera.com/</span>
      </a>
      <a class="link-row alt" href="https://www.dw.com/ru/" target="_blank" rel="noopener">
        <span class="link-name">DW на русском</span>
        <span class="link-url">https://www.dw.com/ru/</span>
      </a>
    </div>
  </div>
</div>

<script>
  /* ============================================================================
     БАЗА СТРАН И ССЫЛОК (Добавляй сюда любые страны и сайты)
     ============================================================================ */
  const COUNTRIES_DB = {
    "Ukraine": {
      name: "Украина",
      official: [
        { title: "Укрінформ", url: "https://www.ukrinform.ua/" },
        { title: "Суспільне Новини", url: "https://suspilne.media/" },
        { title: "РБК-Україна", url: "https://www.rbc.ua/" }
      ],
      alternative: [
        { title: "Українська правда", url: "https://www.pravda.com.ua/" },
        { title: "BBC Україна", url: "https://www.bbc.com/ukrainian" },
        { title: "Радіо Свобода", url: "https://www.radiosvoboda.org/" }
      ]
    },
    "Russia": {
      name: "Россия",
      official: [
        { title: "ТАСС", url: "https://tass.ru/" },
        { title: "РИА Новости", url: "https://ria.ru/" },
        { title: "Интерфакс", url: "https://www.interfax.ru/" }
      ],
      alternative: [
        { title: "Медуза", url: "https://meduza.io/" },
        { title: "BBC Русская служба", url: "https://www.bbc.com/russian" },
        { title: "Медиазона", url: "https://zona.media/" }
      ]
    },
    "France": {
      name: "Франция",
      official: [
        { title: "AFP", url: "https://www.afp.com/fr" },
        { title: "France Info", url: "https://www.francetvinfo.fr/" },
        { title: "Le Monde", url: "https://www.lemonde.fr/" }
      ],
      alternative: [
        { title: "Mediapart", url: "https://www.mediapart.fr/" },
        { title: "France 24", url: "https://www.france24.com/fr/" }
      ]
    },
    "Germany": {
      name: "Германия",
      official: [
        { title: "Tagesschau", url: "https://www.tagesschau.de/" },
        { title: "Der Spiegel", url: "https://www.spiegel.de/" }
      ],
      alternative: [
        { title: "Deutsche Welle", url: "https://www.dw.com/" }
      ]
    },
    "United States of America": {
      name: "США",
      official: [
        { title: "Associated Press", url: "https://apnews.com/" },
        { title: "NPR News", url: "https://www.npr.org/" }
      ],
      alternative: [
        { title: "The Intercept", url: "https://theintercept.com/" },
        { title: "The Guardian US", url: "https://www.theguardian.com/us" }
      ]
    },
    "United Kingdom": {
      name: "Великобритания",
      official: [
        { title: "BBC News UK", url: "https://www.bbc.co.uk/news" },
        { title: "Sky News", url: "https://news.sky.com/" }
      ],
      alternative: [
        { title: "The Guardian", url: "https://www.theguardian.com/uk" }
      ]
    },
    "Poland": {
      name: "Польша",
      official: [
        { title: "PAP", url: "https://www.pap.pl/" },
        { title: "TVN24", url: "https://tvn24.pl/" }
      ],
      alternative: [
        { title: "OKO.press", url: "https://oko.press/" }
      ]
    }
  };

  const WORLD_DEFAULT = {
    name: "Мировые порталы",
    official: [
      { title: "Reuters", url: "https://www.reuters.com/" },
      { title: "Associated Press", url: "https://apnews.com/" },
      { title: "BBC World", url: "https://www.bbc.com/news/world" }
    ],
    alternative: [
      { title: "Al Jazeera", url: "https://www.aljazeera.com/" },
      { title: "DW на русском", url: "https://www.dw.com/ru/" }
    ]
  };

  let activeCountry = null;
  let allPolygons = [];
  let world = null;

  // Заполняем выпадающий список из базы
  const selectEl = document.getElementById("country-select");
  Object.keys(COUNTRIES_DB).forEach(key => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = COUNTRIES_DB[key].name;
    selectEl.appendChild(opt);
  });

  function renderLinks(countryKey) {
    const titleEl = document.getElementById("region-title");
    const statusEl = document.getElementById("region-status");
    const officialBox = document.getElementById("official-links");
    const altBox = document.getElementById("alt-links");

    let info = WORLD_DEFAULT;

    if (countryKey) {
      const foundKey = Object.keys(COUNTRIES_DB).find(
        k => k.toLowerCase() === countryKey.toLowerCase()
      );
      if (foundKey) {
        info = COUNTRIES_DB[foundKey];
      } else {
        const q = encodeURIComponent(countryKey);
        info = {
          name: countryKey,
          official: [
            { title: "Google News", url: `https://news.google.com/search?q=${q}` },
            { title: "Reuters", url: `https://www.reuters.com/site-search/?query=${q}` }
          ],
          alternative: [
            { title: "BBC News", url: `https://www.bbc.co.uk/search?q=${q}` },
            { title: "Al Jazeera", url: `https://www.aljazeera.com/search/${q}` }
          ]
        };
      }
      statusEl.textContent = "Ссылки открыты";
    } else {
      statusEl.textContent = "Весь мир";
    }

    titleEl.textContent = info.name;

    officialBox.innerHTML = info.official.map(item => `
      <a class="link-row" href="${item.url}" target="_blank" rel="noopener noreferrer">
        <span class="link-name">${item.title}</span>
        <span class="link-url">${item.url}</span>
      </a>
    `).join("");

    altBox.innerHTML = info.alternative.map(item => `
      <a class="link-row alt" href="${item.url}" target="_blank" rel="noopener noreferrer">
        <span class="link-name">${item.title}</span>
        <span class="link-url">${item.url}</span>
      </a>
    `).join("");
  }

  function isCrimeaRing(ring) {
    if (!Array.isArray(ring) || ring.length === 0) return false;
    let lngSum = 0, latSum = 0;
    for (let i = 0; i < ring.length; i++) {
      lngSum += ring[i][0];
      latSum += ring[i][1];
    }
    const lng = lngSum / ring.length;
    const lat = latSum / ring.length;
    return lng >= 32.4 && lng <= 36.7 && lat >= 44.3 && lat <= 46.25;
  }

  function selectCountry(countryName, featureObj) {
    activeCountry = countryName;
    document.getElementById("btn-world").classList.remove("active");
    selectEl.value = Object.keys(COUNTRIES_DB).find(k => k.toLowerCase() === countryName.toLowerCase()) || "";

    if (world) {
      world.controls().autoRotate = false;
      world.polygonsData(allPolygons);
      if (featureObj && featureObj.bbox) {
        const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
        world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 800);
      }
    }

    renderLinks(countryName);
  }

  function selectWorld() {
    activeCountry = null;
    document.getElementById("btn-world").classList.add("active");
    selectEl.value = "";
    if (world) {
      world.controls().autoRotate = true;
      world.polygonsData(allPolygons);
      world.pointOfView({ altitude: 2.3 }, 800);
    }
    renderLinks(null);
  }

  function onSelectDropdown(val) {
    if (!val) {
      selectWorld();
      return;
    }
    const found = allPolygons.find(f => f.properties.ADMIN.toLowerCase() === val.toLowerCase());
    selectCountry(val, found || null);
  }

  // Инициализация глобуса
  window.addEventListener("load", () => {
    const wrapper = document.getElementById("globe-wrapper");
    const container = document.getElementById("globe-container");

    if (typeof Globe === "function") {
      world = Globe()(container)
        .width(wrapper.clientWidth)
        .height(wrapper.clientHeight)
        .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
        .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
        .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
        .polygonAltitude(d => (d.properties.ADMIN === activeCountry ? 0.05 : 0.012))
        .polygonCapColor(d =>
          d.properties.ADMIN === activeCountry ? "rgba(56, 189, 248, 0.6)" : "rgba(30, 41, 59, 0.28)"
        )
        .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
        .polygonStrokeColor(d =>
          d.properties.ADMIN === activeCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.4)"
        )
        .onPolygonClick(polygon => {
          if (polygon && polygon.properties) {
            selectCountry(polygon.properties.ADMIN, polygon);
          }
        });

      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.4;

      window.addEventListener("resize", () => {
        world.width(wrapper.clientWidth).height(wrapper.clientHeight);
      });
    }

    fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
      .then(r => r.json())
      .then(data => {
        const ukraine = data.features.find(f => f.properties.ADMIN === "Ukraine");
        const russia = data.features.find(f => f.properties.ADMIN === "Russia");

        data.features = data.features.filter(f => {
          const label = ((f.properties.NAME || "") + " " + (f.properties.ADMIN || "")).toLowerCase();
          return !label.includes("crimea") && f.properties.ISO_A2 !== "AQ";
        });

        if (russia && russia.geometry && russia.geometry.type === "MultiPolygon") {
          russia.geometry.coordinates = russia.geometry.coordinates.filter(poly => !isCrimeaRing(poly[0]));
        }

        fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
          .then(r => r.json())
          .then(ukr => {
            if (ukr && ukr.features && ukr.features[0] && ukraine) {
              ukraine.geometry = ukr.features[0].geometry;
            }
            allPolygons = data.features;
            if (world) world.polygonsData(allPolygons);
          })
          .catch(() => {
            allPolygons = data.features;
            if (world) world.polygonsData(allPolygons);
          });
      });
  });
</script>
</body>
</html>
