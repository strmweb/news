<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TG News Radar — Пульт редактора</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #globe-container {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    #top-bar > * { pointer-events: auto; }
    .glass-panel {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s;
    }
    button:hover { border-color: #38bdf8; color: #38bdf8; }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    #country-search {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      width: 170px;
    }

    #sidebar {
      width: 480px;
      max-width: 100vw;
      background: #0d1117;
      border-left: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
    }

    .sidebar-header {
      padding: 14px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .region-title { font-size: 18px; font-weight: 700; color: #f0f6fc; }
    .country-tag-pill {
      font-size: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .workspace-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-box {
      background: #131822;
      border: 1px solid #262c36;
      border-radius: 10px;
      padding: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Гарантированное отображение сетки сайтов */
    .sites-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .site-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.15s;
    }
    .site-official {
      background: rgba(2, 132, 199, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .site-official:hover { background: rgba(2, 132, 199, 0.3); color: #fff; }
    .site-alt {
      background: rgba(217, 119, 6, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .site-alt:hover { background: rgba(217, 119, 6, 0.3); color: #fff; }
    .site-domain { font-size: 11px; opacity: 0.7; font-weight: 400; }

    /* Лента */
    .news-item {
      padding: 10px;
      background: #161b22;
      border: 1px solid #262c36;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .news-item-title {
      color: #f0f6fc;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      display: block;
      margin-bottom: 8px;
    }
    .news-item-title:hover { color: #38bdf8; }
    .news-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .btn-tg-small {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
    }

    /* Черновик */
    .tg-composer {
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
    }
    #tg-draft {
      width: 100%;
      height: 60px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 12px;
      resize: none;
      font-family: inherit;
      margin-bottom: 6px;
    }
    .composer-footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .btn-copy-main {
      background: #16a34a;
      border-color: #22c55e;
      color: #fff;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
    }

    #toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #16a34a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 850px) {
      body { flex-direction: column; }
      #globe-container { height: 35vh; flex: none; }
      #sidebar { width: 100%; height: 65vh; border-left: none; border-top: 1px solid #30363d; }
    }
  </style>
</head>
<body>

<div id="globe-container">
  <div id="top-bar">
    <div class="glass-panel">
      <button id="btn-world" class="active">🌍 Весь мир</button>
      <input type="text" id="country-search" placeholder="Страна (напр. France)..." list="countries-datalist" />
      <datalist id="countries-datalist"></datalist>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="region-title" id="current-region">🌍 Мировые СМИ</div>
    <span class="country-tag-pill" id="current-hashtag">#Мир</span>
  </div>

  <div class="workspace-scroll">
    <!-- 1. Официальные сайты -->
    <div class="section-box">
      <div class="section-title"><span>🏛 Официальные / Родные СМИ</span></div>
      <div class="sites-list" id="official-sites-list"></div>
    </div>

    <!-- 2. Альтернативные -->
    <div class="section-box">
      <div class="section-title"><span>🔍 Альтернативные СМИ</span></div>
      <div class="sites-list" id="alt-sites-list"></div>
    </div>

    <!-- 3. Лента -->
    <div class="section-box">
      <div class="section-title">
        <span>⚡️ Лента событий</span>
        <span id="feed-status" style="font-weight:400;font-size:11px;">Загрузка...</span>
      </div>
      <div id="news-feed-container"></div>
    </div>
  </div>

  <div class="tg-composer">
    <textarea id="tg-draft" placeholder="Черновик для поста..."></textarea>
    <div class="composer-footer">
      <button id="btn-clear">Очистить</button>
      <button id="btn-add-tag">+ Хэштег</button>
      <button id="btn-copy-post" class="btn-copy-main">📋 Копировать в TG</button>
    </div>
  </div>
</div>

<div id="toast">Скопировано!</div>

<script>
  /* БАЗА СТРАН И ССЫЛОК (Можешь вручную править и добавлять сюда сайты) */
  const MY_COUNTRIES_DB = {
    "Ukraine": {
      ruName: "🇺🇦 Украина",
      hashtag: "#Украина",
      official: [
        { name: "Укрінформ", url: "https://www.ukrinform.ua/" },
        { name: "Суспільне Новини", url: "https://suspilne.media/" },
        { name: "РБК-Україна", url: "https://www.rbc.ua/" }
      ],
      alternative: [
        { name: "Українська правда", url: "https://www.pravda.com.ua/" },
        { name: "BBC Україна", url: "https://www.bbc.com/ukrainian" },
        { name: "Радіо Свобода", url: "https://www.radiosvoboda.org/" }
      ],
      rss: ["https://www.ukrinform.ua/rss/block-lastnews"]
    },

    "France": {
      ruName: "🇫🇷 Франция",
      hashtag: "#Франция",
      official: [
        { name: "AFP (Агентство)", url: "https://www.afp.com/fr" },
        { name: "France Info", url: "https://www.francetvinfo.fr/" },
        { name: "Le Monde", url: "https://www.lemonde.fr/" }
      ],
      alternative: [
        { name: "Mediapart", url: "https://www.mediapart.fr/" },
        { name: "France 24", url: "https://www.france24.com/fr/" }
      ],
      rss: ["https://www.lemonde.fr/rss/une.xml"]
    },

    "Germany": {
      ruName: "🇩🇪 Германия",
      hashtag: "#Германия",
      official: [
        { name: "Tagesschau", url: "https://www.tagesschau.de/" },
        { name: "Der Spiegel", url: "https://www.spiegel.de/" }
      ],
      alternative: [
        { name: "Deutsche Welle (DW)", url: "https://www.dw.com/" }
      ],
      rss: ["https://www.tagesschau.de/xml/rss2/"]
    },

    "United States of America": {
      ruName: "🇺🇸 США",
      hashtag: "#США",
      official: [
        { name: "Associated Press", url: "https://apnews.com/" },
        { name: "NPR News", url: "https://www.npr.org/" }
      ],
      alternative: [
        { name: "The Intercept", url: "https://theintercept.com/" },
        { name: "The Guardian US", url: "https://www.theguardian.com/us" }
      ],
      rss: ["https://feeds.npr.org/1001/rss.xml"]
    },

    "United Kingdom": {
      ruName: "🇬🇧 Британия",
      hashtag: "#Британия",
      official: [
        { name: "BBC News UK", url: "https://www.bbc.co.uk/news" },
        { name: "Sky News", url: "https://news.sky.com/" }
      ],
      alternative: [
        { name: "The Guardian", url: "https://www.theguardian.com/uk" }
      ],
      rss: ["https://feeds.bbci.co.uk/news/uk/rss.xml"]
    },

    "Poland": {
      ruName: "🇵🇱 Польша",
      hashtag: "#Польша",
      official: [
        { name: "PAP (Агентство)", url: "https://www.pap.pl/" },
        { name: "TVN24", url: "https://tvn24.pl/" }
      ],
      alternative: [
        { name: "OKO.press", url: "https://oko.press/" }
      ],
      rss: ["https://tvn24.pl/najnowsze.xml"]
    }
  };

  const GLOBAL_DB = {
    ruName: "🌍 Мировые СМИ",
    hashtag: "#Мир",
    official: [
      { name: "Reuters", url: "https://www.reuters.com/" },
      { name: "Associated Press", url: "https://apnews.com/" },
      { name: "BBC World", url: "https://www.bbc.com/news/world" }
    ],
    alternative: [
      { name: "Al Jazeera", url: "https://www.aljazeera.com/" },
      { name: "DW на русском", url: "https://www.dw.com/ru/" }
    ],
    rss: ["https://feeds.bbci.co.uk/news/world/rss.xml"]
  };

  let selectedCountry = null;
  let countriesFeatures = [];
  let lastClickTime = 0;

  function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace("www.", ""); } catch { return "сайт"; }
  }

  function renderCountryLinks() {
    const officialBox = document.getElementById("official-sites-list");
    const altBox = document.getElementById("alt-sites-list");
    const titleEl = document.getElementById("current-region");
    const tagEl = document.getElementById("current-hashtag");

    let data = null;
    if (!selectedCountry) {
      data = GLOBAL_DB;
    } else if (MY_COUNTRIES_DB[selectedCountry]) {
      data = MY_COUNTRIES_DB[selectedCountry];
    } else {
      const q = encodeURIComponent(selectedCountry);
      data = {
        ruName: `📍 ${selectedCountry}`,
        hashtag: `#${selectedCountry.replace(/[^a-zA-Zа-яА-Я0-9]/g, "")}`,
        official: [
          { name: `Google News (${selectedCountry})`, url: `https://news.google.com/search?q=${q}` },
          { name: `Reuters (${selectedCountry})`, url: `https://www.reuters.com/site-search/?query=${q}` }
        ],
        alternative: [
          { name: `BBC (${selectedCountry})`, url: `https://www.bbc.co.uk/search?q=${q}` },
          { name: `Al Jazeera (${selectedCountry})`, url: `https://www.aljazeera.com/search/${q}` }
        ],
        rss: [`https://news.google.com/rss/search?q=${q}&hl=en&gl=US&ceid=US:en`]
      };
    }

    titleEl.textContent = data.ruName;
    tagEl.textContent = data.hashtag;

    officialBox.innerHTML = data.official.map(site => `
      <a class="site-link site-official" href="${site.url}" target="_blank" rel="noopener">
        <span>${site.name}</span>
        <span class="site-domain">${getDomain(site.url)} ↗</span>
      </a>
    `).join("");

    altBox.innerHTML = data.alternative.map(site => `
      <a class="site-link site-alt" href="${site.url}" target="_blank" rel="noopener">
        <span>${site.name}</span>
        <span class="site-domain">${getDomain(site.url)} ↗</span>
      </a>
    `).join("");

    loadRSSFeed(data.rss || [], data.hashtag);
  }

  async function loadRSSFeed(rssUrls, hashtag) {
    const feedBox = document.getElementById("news-feed-container");
    const statusEl = document.getElementById("feed-status");

    if (!rssUrls || rssUrls.length === 0) {
      statusEl.textContent = "Готово";
      feedBox.innerHTML = `<div style="font-size:12px;color:#8b949e;padding:6px;">Используйте ссылки на официальные сайты выше ☝️</div>`;
      return;
    }

    statusEl.textContent = "Загрузка...";
    feedBox.innerHTML = "";

    let allItems = [];
    for (const url of rssUrls) {
      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
        const json = await res.json();
        if (json.status === "ok" && Array.isArray(json.items)) {
          json.items.slice(0, 5).forEach(item => {
            allItems.push({ title: item.title, link: item.link, source: json.feed?.title || getDomain(url) });
          });
        }
      } catch (e) {}
    }

    if (allItems.length === 0) {
      statusEl.textContent = "Доступ через сайты";
      feedBox.innerHTML = `<div style="font-size:12px;color:#8b949e;padding:6px;">Нажмите на любой официальный сайт выше, чтобы открыть свежие новости.</div>`;
      return;
    }

    statusEl.textContent = `Сводки: ${allItems.length}`;
    allItems.forEach(item => {
      const div = document.createElement("div");
      div.className = "news-item";
      div.innerHTML = `
        <a class="news-item-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
        <div class="news-actions">
          <button class="btn-tg-small">📋 В TG</button>
        </div>
      `;

      div.querySelector(".btn-tg-small").addEventListener("click", () => {
        const post = `⚡️ ${item.title}\n\n🔗 ${item.link}\n\n${hashtag}`;
        navigator.clipboard.writeText(post);
        showToast("✅ Пост скопирован для TG!");
      });

      feedBox.appendChild(div);
    });
  }

  const world = Globe()(document.getElementById("globe-container"))
    .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
    .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
    .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
    .lineHoverPrecision(0)
    .polygonAltitude(d => (d.properties.ADMIN === selectedCountry ? 0.05 : 0.01))
    .polygonCapColor(d => d.properties.ADMIN === selectedCountry ? "rgba(56, 189, 248, 0.55)" : "rgba(30, 41, 59, 0.25)")
    .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
    .polygonStrokeColor(d => d.properties.ADMIN === selectedCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.35)")
    .polygonLabel(({ properties: d }) => {
      const custom = MY_COUNTRIES_DB[d.ADMIN];
      return `<div style="background:rgba(13,17,23,0.95);padding:6px 10px;border-radius:6px;border:1px solid #38bdf8;font-size:12px;"><b>${custom ? custom.ruName : d.ADMIN}</b></div>`;
    })
    .onPolygonClick(polygon => { selectCountry(polygon.properties.ADMIN, polygon); })
    .onGlobeClick(() => {
      const now = Date.now();
      if (now - lastClickTime < 350) resetToGlobal();
      lastClickTime = now;
    });

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
    .then(res => res.json())
    .then(countries => {
      const ukraine = countries.features.find(f => f.properties.ADMIN === "Ukraine");
      const crimea = countries.features.find(f => (f.properties.NAME && f.properties.NAME.includes("Crimea")) || (f.properties.ADMIN && f.properties.ADMIN.includes("Crimea")));
      if (ukraine && crimea) {
        crimea.properties.ADMIN = "Ukraine";
        crimea.properties.NAME = "Ukraine";
      }

      fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
        .then(r => r.json())
        .then(ukrGeo => {
          if (ukrGeo && ukrGeo.features && ukrGeo.features[0] && ukraine) {
            ukraine.geometry = ukrGeo.features[0].geometry;
          }
          applyCountries(countries.features);
        })
        .catch(() => applyCountries(countries.features));
    });

  function applyCountries(features) {
    countriesFeatures = features.filter(d => d.properties.ISO_A2 !== "AQ");
    world.polygonsData(countriesFeatures);
    const datalist = document.getElementById("countries-datalist");
    countriesFeatures.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.properties.ADMIN;
      datalist.appendChild(opt);
    });
  }

  function selectCountry(countryName, featureObj = null) {
    selectedCountry = countryName;
    world.controls().autoRotate = false;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.remove("active");

    if (featureObj && featureObj.bbox) {
      const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
      world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 1000);
    }
    renderCountryLinks();
  }

  function resetToGlobal() {
    selectedCountry = null;
    world.controls().autoRotate = true;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.add("active");
    world.pointOfView({ altitude: 2.3 }, 1000);
    renderCountryLinks();
  }

  document.getElementById("btn-world").addEventListener("click", resetToGlobal);
  document.getElementById("country-search").addEventListener("change", e => {
    const val = e.target.value.trim();
    const found = countriesFeatures.find(f => f.properties.ADMIN.toLowerCase() === val.toLowerCase());
    if (found) selectCountry(found.properties.ADMIN, found);
  });

  document.getElementById("btn-copy-post").addEventListener("click", () => {
    const draft = document.getElementById("tg-draft").value.trim();
    if (!draft) return;
    navigator.clipboard.writeText(draft);
    showToast("✅ Скопировано в буфер!");
  });

  document.getElementById("btn-add-tag").addEventListener("click", () => {
    const tag = document.getElementById("current-hashtag").textContent;
    const draft = document.getElementById("tg-draft");
    draft.value += (draft.value ? `\n\n${tag}` : tag);
  });

  document.getElementById("btn-clear").addEventListener("click", () => { document.getElementById("tg-draft").value = ""; });

  renderCountryLinks();
</script>
</body>
</html>
