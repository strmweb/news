<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TG News Radar — Пульт редактора</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #050811;
      color: #e6edf3;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #globe-container {
      flex: 1;
      position: relative;
      height: 100%;
    }
    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }
    #top-bar > * { pointer-events: auto; }
    .glass-panel {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s;
    }
    button:hover { border-color: #38bdf8; color: #38bdf8; }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    #country-search {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      width: 170px;
    }

    #sidebar {
      width: 490px;
      max-width: 100vw;
      background: #0d1117;
      border-left: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 20;
    }

    .sidebar-header {
      padding: 14px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .region-title { font-size: 18px; font-weight: 700; color: #f0f6fc; }
    .country-tag-pill {
      font-size: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .workspace-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-box {
      background: #131822;
      border: 1px solid #262c36;
      border-radius: 10px;
      padding: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Ссылки на сайты */
    .sites-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .site-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: 0.15s;
    }
    .site-official {
      background: rgba(2, 132, 199, 0.18);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .site-official:hover { background: rgba(2, 132, 199, 0.35); color: #fff; }
    .site-alt {
      background: rgba(217, 119, 6, 0.18);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .site-alt:hover { background: rgba(217, 119, 6, 0.35); color: #fff; }
    .site-domain { font-size: 11px; opacity: 0.8; font-weight: 400; }

    /* Карточки быстрых ссылок на ленты */
    .news-card {
      background: #161b22;
      border: 1px solid #262c36;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .news-title {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.4;
      display: block;
      margin-bottom: 4px;
    }
    .news-title:hover { text-decoration: underline; }

    /* Черновик */
    .tg-composer {
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
    }
    #tg-draft {
      width: 100%;
      height: 70px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      padding: 8px 10px;
      font-size: 12.5px;
      resize: none;
      font-family: inherit;
      margin-bottom: 6px;
    }
    .composer-footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .btn-copy-main {
      background: #16a34a;
      border-color: #22c55e;
      color: #fff;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #16a34a;
      color: #fff;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 850px) {
      body { flex-direction: column; }
      #globe-container { height: 30vh; flex: none; }
      #sidebar { width: 100%; height: 70vh; border-left: none; border-top: 1px solid #30363d; }
    }
  </style>
</head>
<body>

<div id="globe-container">
  <div id="top-bar">
    <div class="glass-panel">
      <button id="btn-world" class="active">🌍 Весь мир</button>
      <input type="text" id="country-search" placeholder="Страна (напр. Ukraine)..." list="countries-datalist" />
      <datalist id="countries-datalist"></datalist>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-header">
    <div class="region-title" id="current-region">🌍 Мировые СМИ</div>
    <span class="country-tag-pill" id="current-hashtag">#Мир</span>
  </div>

  <div class="workspace-scroll">
    <!-- 1. Быстрый переход к свежим лентам новостей страны -->
    <div class="section-box">
      <div class="section-title"><span>⚡️ Ленты и поисковые сводки новостей</span></div>
      <div id="news-feeds-list"></div>
    </div>

    <!-- 2. Официальные сайты -->
    <div class="section-box">
      <div class="section-title"><span>🏛 Официальные / Родные сайты СМИ</span></div>
      <div class="sites-grid" id="official-sites-list"></div>
    </div>

    <!-- 3. Альтернативные сайты -->
    <div class="section-box">
      <div class="section-title"><span>🔍 Альтернативные источники</span></div>
      <div class="sites-grid" id="alt-sites-list"></div>
    </div>
  </div>

  <div class="tg-composer">
    <textarea id="tg-draft" placeholder="Черновик для поста в Telegram..."></textarea>
    <div class="composer-footer">
      <button id="btn-clear">Очистить</button>
      <button id="btn-add-tag">+ Хэштег</button>
      <button id="btn-copy-post" class="btn-copy-main">📋 Копировать в TG</button>
    </div>
  </div>
</div>

<div id="toast">Скопировано в буфер!</div>

<script>
  /* ============================================================================
     БАЗА СТРАН И ССЫЛОК (Можешь вручную добавлять сюда любые страны и сайты)
     ============================================================================ */
  const MY_COUNTRIES_DB = {
    "Ukraine": {
      ruName: "🇺🇦 Украина",
      hashtag: "#Украина",
      official: [
        { name: "Укрінформ", url: "https://www.ukrinform.ua/" },
        { name: "Суспільне Новини", url: "https://suspilne.media/" },
        { name: "РБК-Україна", url: "https://www.rbc.ua/" }
      ],
      alternative: [
        { name: "Українська правда", url: "https://www.pravda.com.ua/" },
        { name: "BBC Україна", url: "https://www.bbc.com/ukrainian" },
        { name: "Радіо Свобода", url: "https://www.radiosvoboda.org/" }
      ]
    },

    "France": {
      ruName: "🇫🇷 Франция",
      hashtag: "#Франция",
      official: [
        { name: "AFP (Агентство)", url: "https://www.afp.com/fr" },
        { name: "France Info", url: "https://www.francetvinfo.fr/" },
        { name: "Le Monde", url: "https://www.lemonde.fr/" }
      ],
      alternative: [
        { name: "Mediapart", url: "https://www.mediapart.fr/" },
        { name: "France 24", url: "https://www.france24.com/fr/" }
      ]
    },

    "Germany": {
      ruName: "🇩🇪 Германия",
      hashtag: "#Германия",
      official: [
        { name: "Tagesschau", url: "https://www.tagesschau.de/" },
        { name: "Der Spiegel", url: "https://www.spiegel.de/" }
      ],
      alternative: [
        { name: "Deutsche Welle (DW)", url: "https://www.dw.com/" }
      ]
    },

    "United States of America": {
      ruName: "🇺🇸 США",
      hashtag: "#США",
      official: [
        { name: "Associated Press", url: "https://apnews.com/" },
        { name: "NPR News", url: "https://www.npr.org/" }
      ],
      alternative: [
        { name: "The Intercept", url: "https://theintercept.com/" },
        { name: "The Guardian US", url: "https://www.theguardian.com/us" }
      ]
    },

    "United Kingdom": {
      ruName: "🇬🇧 Британия",
      hashtag: "#Британия",
      official: [
        { name: "BBC News UK", url: "https://www.bbc.co.uk/news" },
        { name: "Sky News", url: "https://news.sky.com/" }
      ],
      alternative: [
        { name: "The Guardian", url: "https://www.theguardian.com/uk" }
      ]
    },

    "Poland": {
      ruName: "🇵🇱 Польша",
      hashtag: "#Польша",
      official: [
        { name: "PAP (Агентство)", url: "https://www.pap.pl/" },
        { name: "TVN24", url: "https://tvn24.pl/" }
      ],
      alternative: [
        { name: "OKO.press", url: "https://oko.press/" }
      ]
    }
  };

  const GLOBAL_DB = {
    ruName: "🌍 Мировые СМИ",
    hashtag: "#Мир",
    official: [
      { name: "Reuters", url: "https://www.reuters.com/" },
      { name: "Associated Press", url: "https://apnews.com/" },
      { name: "BBC World", url: "https://www.bbc.com/news/world" }
    ],
    alternative: [
      { name: "Al Jazeera", url: "https://www.aljazeera.com/" },
      { name: "DW на русском", url: "https://www.dw.com/ru/" }
    ]
  };

  let selectedCountry = null;
  let countriesFeatures = [];
  let lastClickTime = 0;

  function showToast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace("www.", ""); } catch { return "сайт"; }
  }

  // Обновление всей панели при клике на страну
  function updateEditorPanel() {
    const officialBox = document.getElementById("official-sites-list");
    const altBox = document.getElementById("alt-sites-list");
    const feedsBox = document.getElementById("news-feeds-list");
    const titleEl = document.getElementById("current-region");
    const tagEl = document.getElementById("current-hashtag");

    let data = null;
    const matchedKey = selectedCountry ? Object.keys(MY_COUNTRIES_DB).find(k => k.toLowerCase() === selectedCountry.toLowerCase()) : null;

    if (!selectedCountry) {
      data = GLOBAL_DB;
    } else if (matchedKey) {
      data = MY_COUNTRIES_DB[matchedKey];
    } else {
      const q = encodeURIComponent(selectedCountry);
      data = {
        ruName: `📍 ${selectedCountry}`,
        hashtag: `#${selectedCountry.replace(/[^a-zA-Zа-яА-Я0-9]/g, "")}`,
        official: [
          { name: `Google News (${selectedCountry})`, url: `https://news.google.com/search?q=${q}` },
          { name: `Reuters (${selectedCountry})`, url: `https://www.reuters.com/site-search/?query=${q}` }
        ],
        alternative: [
          { name: `BBC (${selectedCountry})`, url: `https://www.bbc.co.uk/search?q=${q}` },
          { name: `Al Jazeera (${selectedCountry})`, url: `https://www.aljazeera.com/search/${q}` }
        ]
      };
    }

    titleEl.textContent = data.ruName;
    tagEl.textContent = data.hashtag;

    // 1. Ссылки на ленты и поисковые сводки новостей
    const searchStr = selectedCountry ? selectedCountry : "world news";
    feedsBox.innerHTML = `
      <div class="news-card">
        <a class="news-title" href="https://news.google.com/search?q=${encodeURIComponent(searchStr)}" target="_blank" rel="noopener">
          ⚡️ Актуальная лента Google News (${searchStr}) ↗
        </a>
        <div style="font-size:11px;color:#8b949e;margin-top:2px;">Мгновенный переход к последним событиям и статьям в реальном времени.</div>
      </div>
    `;

    // 2. Официальные сайты СМИ
    officialBox.innerHTML = data.official.map(site => `
      <a class="site-link site-official" href="${site.url}" target="_blank" rel="noopener">
        <span>${site.name}</span>
        <span class="site-domain">${getDomain(site.url)} ↗</span>
      </a>
    `).join("");

    // 3. Альтернативные источники
    altBox.innerHTML = data.alternative.map(site => `
      <a class="site-link site-alt" href="${site.url}" target="_blank" rel="noopener">
        <span>${site.name}</span>
        <span class="site-domain">${getDomain(site.url)} ↗</span>
      </a>
    `).join("");
  }

  // Инициализация 3D-глобуса
  const world = Globe()(document.getElementById("globe-container"))
    .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
    .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
    .backgroundImageUrl("https://unpkg.com/three-globe/example/img/night-sky.png")
    .lineHoverPrecision(0)
    .polygonAltitude(d => (d.properties.ADMIN === selectedCountry ? 0.05 : 0.01))
    .polygonCapColor(d => d.properties.ADMIN === selectedCountry ? "rgba(56, 189, 248, 0.55)" : "rgba(30, 41, 59, 0.25)")
    .polygonSideColor(() => "rgba(56, 189, 248, 0.15)")
    .polygonStrokeColor(d => d.properties.ADMIN === selectedCountry ? "#38bdf8" : "rgba(148, 163, 184, 0.35)")
    .polygonLabel(({ properties: d }) => {
      const matchedKey = Object.keys(MY_COUNTRIES_DB).find(k => k.toLowerCase() === d.ADMIN.toLowerCase());
      const custom = matchedKey ? MY_COUNTRIES_DB[matchedKey] : null;
      return `<div style="background:rgba(13,17,23,0.95);padding:6px 10px;border-radius:6px;border:1px solid #38bdf8;font-size:12px;"><b>${custom ? custom.ruName : d.ADMIN}</b></div>`;
    })
    .onPolygonClick(polygon => { selectCountry(polygon.properties.ADMIN, polygon); })
    .onGlobeClick(() => {
      const now = Date.now();
      if (now - lastClickTime < 350) resetToGlobal();
      lastClickTime = now;
    });

  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.4;

  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
    .then(res => res.json())
    .then(countries => {
      const ukraine = countries.features.find(f => f.properties.ADMIN === "Ukraine");
      const crimea = countries.features.find(f => (f.properties.NAME && f.properties.NAME.includes("Crimea")) || (f.properties.ADMIN && f.properties.ADMIN.includes("Crimea")));
      if (ukraine && crimea) {
        crimea.properties.ADMIN = "Ukraine";
        crimea.properties.NAME = "Ukraine";
      }

      fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json")
        .then(r => r.json())
        .then(ukrGeo => {
          if (ukrGeo && ukrGeo.features && ukrGeo.features[0] && ukraine) {
            ukraine.geometry = ukrGeo.features[0].geometry;
          }
          applyCountries(countries.features);
        })
        .catch(() => applyCountries(countries.features));
    });

  function applyCountries(features) {
    countriesFeatures = features.filter(d => d.properties.ISO_A2 !== "AQ");
    world.polygonsData(countriesFeatures);
    const datalist = document.getElementById("countries-datalist");
    countriesFeatures.forEach(f => {
      const opt = document.createElement("option");
      opt.value = f.properties.ADMIN;
      datalist.appendChild(opt);
    });
  }

  function selectCountry(countryName, featureObj = null) {
    selectedCountry = countryName;
    world.controls().autoRotate = false;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.remove("active");

    if (featureObj && featureObj.bbox) {
      const [minLng, minLat, maxLng, maxLat] = featureObj.bbox;
      world.pointOfView({ lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2, altitude: 1.4 }, 1000);
    }
    updateEditorPanel();
  }

  function resetToGlobal() {
    selectedCountry = null;
    world.controls().autoRotate = true;
    world.polygonsData(world.polygonsData());
    document.getElementById("btn-world").classList.add("active");
    world.pointOfView({ altitude: 2.3 }, 1000);
    updateEditorPanel();
  }

  document.getElementById("btn-world").addEventListener("click", resetToGlobal);
  document.getElementById("country-search").addEventListener("change", e => {
    const val = e.target.value.trim().toLowerCase();
    const found = countriesFeatures.find(f => f.properties.ADMIN.toLowerCase() === val);
    if (found) selectCountry(found.properties.ADMIN, found);
  });

  document.getElementById("btn-copy-post").addEventListener("click", () => {
    const draft = document.getElementById("tg-draft").value.trim();
    if (!draft) return;
    navigator.clipboard.writeText(draft);
    showToast("✅ Пост скопирован для Telegram!");
  });

  document.getElementById("btn-add-tag").addEventListener("click", () => {
    const tag = document.getElementById("current-hashtag").textContent;
    const draft = document.getElementById("tg-draft");
    draft.value += (draft.value ? `\n\n${tag}` : tag);
  });

  document.getElementById("btn-clear").addEventListener("click", () => { document.getElementById("tg-draft").value = ""; });

  updateEditorPanel();
</script>
</body>
</html>
